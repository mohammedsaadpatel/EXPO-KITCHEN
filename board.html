<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EXPO Board</title><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Patrick+Hand&display=swap" rel="stylesheet"><script>try{document.documentElement.dataset.theme=localStorage.getItem("expo.theme")||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/theme.css"><link rel="stylesheet" href="css/receipt.css"></head><body>
<div class="sp"></div><nav><a class="logo" href="index.html">EXPO</a><a class="l" href="index.html">Home</a><a class="l" href="how-it-works.html">How it works</a><a class="btn" href="board.html" style="font-size:1.4rem;padding:4px 18px">Open board</a><button class="sw" id="sw" aria-label="Switch light or dark theme"><i></i></button></nav>
<div class="wrap">
<div class="top"><div class="next" id="next">ALL CLEAR</div><span class="chip calm" id="c-calm">0</span><span class="chip warn" id="c-warn">0</span><span class="chip late" id="c-late">0</span><button class="btn" id="undo">↩ UNDO</button><button class="btn alt" id="seed">DEMO</button><button class="btn alt" id="clear">CLEAR</button></div>
<details class="add" open><summary>+ NEW ORDER</summary><form id="f"><div><input id="t" placeholder="Table / ticket" maxlength="10" autocomplete="off"></div><div><textarea id="i" placeholder="One item per line. Allergy? add !peanut after the item"></textarea><div class="alc"><span>⚠ ALLERGY:</span><button type="button" data-a="Peanut">Peanut</button><button type="button" data-a="Tree nut">Tree nut</button><button type="button" data-a="Gluten">Gluten</button><button type="button" data-a="Dairy">Dairy</button><button type="button" data-a="Egg">Egg</button><button type="button" data-a="Shellfish">Shellfish</button><button type="button" data-a="Soy">Soy</button></div><small class="hint">Tap a chip to tag the last item, or type !allergy after it.</small></div><div><input id="m" type="number" min="1" max="90" value="10"><div class="pre"><button type="button" data-m="5">5m</button><button type="button" data-m="10">10m</button><button type="button" data-m="15">15m</button><button type="button" data-m="20">20m</button></div></div><button class="btn" style="font-size:2.2rem">ADD</button></form></details>
<div class="board" id="board"></div></div>
<div id="toast"></div>
<script src="js/main.js"></script><script src="js/board.js"></script></body></html>
